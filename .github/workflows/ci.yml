name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python verification tests (no Vivado needed)
  # ---------------------------------------------------------------------------
  verify:
    name: Python verification (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # Includes python/test_encoder.py: the reference-encoder PSNR check.
      - name: Set up Python ${{ matrix.python-version }}, deps, test image
        uses: ./.github/actions/setup-sim
        with:
          python-version: ${{ matrix.python-version }}
          apt-packages: ffmpeg
          pip-extra: "pytest>=8,<10"

      - name: Verify Huffman ROM tables
        run: python python/verify_huffman_rom.py

      - name: Verify LITE_QUALITY tables
        run: python python/verify_lite_quality.py

      - name: Verify quality-scale formula agrees across RTL/VHDL/Python
        run: python python/verify_quality_scale.py

      - name: LiteX integration unit tests (pytest)
        run: python -m pytest tests -q

      - name: Visual quality comparison (mandrill encode/decode, Q=50/75/95)
        run: |
          python python/mandrill_compare.py --quality 50 --out mandrill_compare_Q50.png
          python python/mandrill_compare.py --quality 75 --out mandrill_compare_Q75.png
          python python/mandrill_compare.py --quality 95 --out mandrill_compare_Q95.png

      - name: Upload quality comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandrill-comparison-py${{ matrix.python-version }}
          path: mandrill_compare_Q*.png

  # ---------------------------------------------------------------------------
  # RTL lint — Verilator (no Vivado needed, available on ubuntu-latest)
  # ---------------------------------------------------------------------------
  rtl-lint:
    name: RTL lint (Verilator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator

      - name: Lint core RTL modules
        run: |
          set -e
          for f in \
            rtl/dct_1d.v \
            rtl/zigzag_reorder.v \
            rtl/bitstream_packer.v \
            rtl/axi4_lite_regs.v \
            rtl/rgb_to_ycbcr.v \
            rtl/jfif_writer.v; do
            echo "--- lint: $f"
            verilator --lint-only -Wall --bbox-unsup "$f"
          done
          echo "--- lint: rtl/dct_2d.v (with dct_1d)"
          verilator --lint-only -Wall --bbox-unsup rtl/dct_1d.v rtl/dct_2d.v
          echo "--- lint: rtl/input_buffer.v (with bram_sdp)"
          verilator --lint-only -Wall --bbox-unsup rtl/bram_sdp.v rtl/input_buffer.v

      - name: Lint quantizer (LITE_MODE=0)
        run: verilator --lint-only -Wall --bbox-unsup -GLITE_MODE=0 rtl/quantizer.v

      - name: Lint quantizer (LITE_MODE=1)
        run: verilator --lint-only -Wall --bbox-unsup -GLITE_MODE=1 rtl/quantizer.v

      - name: Lint huffman_encoder
        run: verilator --lint-only -Wall --bbox-unsup rtl/huffman_encoder.v

      - name: Lint jfif_writer
        run: verilator --lint-only -Wall --bbox-unsup rtl/jfif_writer.v

      - name: Lint top-level (LITE_MODE=0, RGB_INPUT=0)
        run: |
          verilator --lint-only -Wall --bbox-unsup -GLITE_MODE=0 \
            rtl/bram_sdp.v \
            rtl/dct_1d.v \
            rtl/dct_2d.v \
            rtl/input_buffer.v \
            rtl/quantizer.v \
            rtl/zigzag_reorder.v \
            rtl/huffman_encoder.v \
            rtl/bitstream_packer.v \
            rtl/jfif_writer.v \
            rtl/axi4_lite_regs.v \
            rtl/rgb_to_ycbcr.v \
            rtl/mjpegzero_enc_top.v

      - name: Lint top-level (LITE_MODE=1, RGB_INPUT=0)
        run: |
          verilator --lint-only -Wall --bbox-unsup -GLITE_MODE=1 \
            rtl/bram_sdp.v \
            rtl/dct_1d.v \
            rtl/dct_2d.v \
            rtl/input_buffer.v \
            rtl/quantizer.v \
            rtl/zigzag_reorder.v \
            rtl/huffman_encoder.v \
            rtl/bitstream_packer.v \
            rtl/jfif_writer.v \
            rtl/axi4_lite_regs.v \
            rtl/rgb_to_ycbcr.v \
            rtl/mjpegzero_enc_top.v

      - name: Lint top-level (LITE_MODE=1, RGB_INPUT=1)
        run: |
          verilator --lint-only -Wall --bbox-unsup -GLITE_MODE=1 -GRGB_INPUT=1 \
            rtl/bram_sdp.v \
            rtl/dct_1d.v \
            rtl/dct_2d.v \
            rtl/input_buffer.v \
            rtl/quantizer.v \
            rtl/zigzag_reorder.v \
            rtl/huffman_encoder.v \
            rtl/bitstream_packer.v \
            rtl/jfif_writer.v \
            rtl/axi4_lite_regs.v \
            rtl/rgb_to_ycbcr.v \
            rtl/mjpegzero_enc_top.v

      - name: Lint top-level (LITE_MODE=0, RGB_INPUT=1)
        run: |
          verilator --lint-only -Wall --bbox-unsup -GLITE_MODE=0 -GRGB_INPUT=1 \
            rtl/bram_sdp.v \
            rtl/dct_1d.v \
            rtl/dct_2d.v \
            rtl/input_buffer.v \
            rtl/quantizer.v \
            rtl/zigzag_reorder.v \
            rtl/huffman_encoder.v \
            rtl/bitstream_packer.v \
            rtl/jfif_writer.v \
            rtl/axi4_lite_regs.v \
            rtl/rgb_to_ycbcr.v \
            rtl/mjpegzero_enc_top.v

      - name: Lint shared behavioral BRAM
        run: verilator --lint-only -Wall --bbox-unsup rtl/bram_sdp.v

  # ---------------------------------------------------------------------------
  # VHDL lint — GHDL analysis. Parallels the Verilator rtl-lint job for the VHDL
  # port. -Wall + --warn-error promotes every GHDL warning to a hard error;
  # --syn-binding suppresses only the default-binding notice (components are
  # bound in the real elaboration flow). Covers all 15 VHDL sources, including
  # demo_jpeg_buffer.vhd and synth_timing_wrapper.vhd, which the cocotb-dual
  # job does not compile — so this is their only CI check.
  # ---------------------------------------------------------------------------
  vhdl-lint:
    name: VHDL lint (GHDL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          # Prefer the GCC backend (see cocotb-dual for the ghdl-llvm soname bug).
          sudo apt-get install -y --no-install-recommends ghdl-gcc \
            || sudo apt-get install -y --no-install-recommends ghdl-mcode \
            || sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version

      - name: Analyze all VHDL sources (-Wall --warn-error, dependency order)
        run: |
          mkdir -p build/ghdl_lint
          ghdl -a --std=93 --syn-binding -Wall --warn-error --workdir=build/ghdl_lint \
            rtl/vhdl/mjpegzero_pkg.vhd \
            rtl/vhdl/axi4_lite_regs.vhd \
            rtl/vhdl/bram_sdp.vhd \
            rtl/vhdl/input_buffer.vhd \
            rtl/vhdl/dct_1d.vhd \
            rtl/vhdl/dct_2d.vhd \
            rtl/vhdl/quantizer.vhd \
            rtl/vhdl/huffman_encoder.vhd \
            rtl/vhdl/bitstream_packer.vhd \
            rtl/vhdl/rgb_to_ycbcr.vhd \
            rtl/vhdl/zigzag_reorder.vhd \
            rtl/vhdl/jfif_writer.vhd \
            rtl/vhdl/mjpegzero_enc_top.vhd \
            rtl/vhdl/demo_jpeg_buffer.vhd \
            rtl/vhdl/synth_timing_wrapper.vhd

  # ---------------------------------------------------------------------------
  # RTL variant tests — iverilog (multi-frame + RGB / gaps / min-width / EXIF /
  # AXI regs). Core golden full/lite is owned by the Verilator + cocotb jobs.
  # ---------------------------------------------------------------------------
  rtl-sim:
    name: RTL variant tests (iverilog)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, iverilog, deps, test image
        uses: ./.github/actions/setup-sim
        with:
          apt-packages: iverilog ffmpeg

      # Entropy-path unit benches: deterministic guards for the gapless zigzag
      # cross-block leak, the packer bp_ready backpressure drop, and the restart
      # tail-bit drop — bugs the full-encoder golden does not reliably exercise.
      - name: RTL unit benches (zigzag gapless / packer backpressure / restart)
        run: python python/run_unit_benches.py

      # Throughput floor: Q100 on the busiest mandrill strip is the worst case
      # for the entropy path. Measured ~80 fps (DCT-limited); a regression that
      # makes Huffman/packer the bottleneck again drops well below 75.
      - name: Throughput guard (Q100 worst-case strip, >= 75 fps 720p @ 150 MHz)
        run: |
          test -f sim/test_vectors/yuyv_720p.hex || python python/generate_test_vectors.py
          python python/measure_throughput.py --quality 100 --rows 0 --min-fps 75

      # NOTE: the core golden (full/lite, single frame) is owned by the Verilator
      # job (rtl-verilator-sim) and the cocotb-dual job. This iverilog job runs
      # only what those don't: the multi-frame regression and the RGB / gaps /
      # min-width / EXIF / AXI-register variants.
      #
      # Multi-frame regression: encode 2 frames of identical input and compare the
      # SECOND frame to golden. Catches per-frame state that is not reset at
      # start-of-scan (e.g. the Huffman DC predictor carrying over between frames,
      # which washed out luma contrast on every frame after the first).
      - name: RTL simulation — multi-frame DC-predictor regression (full mode, 2 frames)
        run: python python/verify_rtl_sim.py --frames 2

      - name: RTL simulation — multi-frame DC-predictor regression (lite mode, 2 frames)
        run: python python/verify_rtl_sim.py --lite --frames 2

      - name: RTL simulation — RGB_INPUT=1 (full mode, Q=95)
        run: python python/verify_rtl_sim.py --rgb

      - name: RTL simulation — RGB_INPUT=1 (lite mode, Q=95)
        run: python python/verify_rtl_sim.py --lite --rgb

      - name: RTL simulation — random backpressure gaps (full mode)
        run: python python/verify_rtl_sim.py --gaps

      - name: RTL simulation — random backpressure gaps (lite mode)
        run: python python/verify_rtl_sim.py --lite --gaps

      - name: RTL simulation — minimum width 16x8 (full mode)
        run: python python/verify_rtl_sim.py --min-width

      - name: RTL simulation — minimum width 16x8 (lite mode)
        run: python python/verify_rtl_sim.py --lite --min-width

      # Q=100 gapless golden: all-1s quant tables keep trailing high-freq
      # coefficients, so this is the quality corner that unmasks the gapless
      # zigzag double-buffer cross-block leak (also guarded by the unit bench,
      # in-context here at the full-encoder level).
      - name: RTL simulation — Q=100 gapless golden (full mode)
        run: python python/verify_rtl_sim.py --quality 100

      - name: RTL simulation — Q=100 gapless golden (lite mode)
        run: python python/verify_rtl_sim.py --lite --quality 100

      # Restart-interval (DRI) end-to-end: encode with RST markers every N MCUs
      # and require the libjpeg-decoded image to be pixel-identical to the
      # no-restart encode. Guards the packer tail-bit drop AND the Huffman
      # DC-predictor reset at each RSTn boundary (a mid-frame reset that raced
      # the next MCU and desynced against the decoder before it was fixed).
      - name: RTL simulation — restart-interval golden (full mode)
        run: python python/verify_rtl_sim.py --restart 1

      - name: RTL simulation — restart-interval golden (lite mode)
        run: python python/verify_rtl_sim.py --lite --restart 1

      - name: EXIF metadata simulation (full mode, 72 DPI)
        run: python python/verify_exif.py

      - name: EXIF metadata simulation (full mode, 96 DPI, custom res)
        run: python python/verify_exif.py --x-res 96 --y-res 96 --res-unit 2

      - name: EXIF metadata simulation (lite mode, 96 DPI)
        run: python python/verify_exif.py --lite --x-res 96 --y-res 96 --res-unit 2

      - name: AXI register coverage (full mode, 2 frames)
        run: python python/verify_axi_regs.py

      - name: AXI register coverage (lite mode, 2 frames)
        run: python python/verify_axi_regs.py --lite

      # Back-to-back multi-row streams of DIFFERENT frames (next SOF arrives
      # while the previous frame is still encoding). Every frame is decoded
      # restart-aware and checked against the Python reference (SOF/DRI/DQT/DHT
      # bytes, RST sequence, +/-1 coefficients). Guards per-frame QUALITY /
      # RESTART latching, ENABLE stalling (not dropping) input, QUALITY clamp,
      # FRAME_SIZE, the SOF bank handling and widths above 2048.
      - name: Stream — back-to-back frames (full, 128x24 x3)
        run: python python/verify_stream.py
      - name: Stream — QUALITY change mid-frame (clamped 120 -> 100) + restart wrap
        run: python python/verify_stream.py --quality2 120 --restart 2
      - name: Stream — Q<50, HUFF_BANKS=4, random gaps
        run: python python/verify_stream.py --quality 30 --huff-banks 4 --gaps
      - name: Stream — lite, ENABLE toggled mid-frame, HUFF_BANKS=2
        run: python python/verify_stream.py --lite --toggle-enable --huff-banks 2
      - name: Stream — QUALITY=0 clamps to 1
        run: python python/verify_stream.py --quality 10 --quality2 0
      - name: Stream — lite Q95, restart 3, gaps
        run: python python/verify_stream.py --lite --quality 95 --restart 3 --gaps
      - name: Stream — RGB input + EXIF
        run: python python/verify_stream.py --rgb --exif --restart 3
      - name: Stream — width 4096 (> 2048 counter widths)
        run: python python/verify_stream.py --width 4096 --height 8 --frames 2

      - name: Upload simulation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-sim-output
          path: build/sim_iverilog/sim_output_*.jpg
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # RTL functional simulation — Verilator (compile + run + JPEG validation)
  # ---------------------------------------------------------------------------
  rtl-verilator-sim:
    name: RTL sim (Verilator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, Verilator, deps, test image
        uses: ./.github/actions/setup-sim
        with:
          apt-packages: verilator g++ make ffmpeg

      - name: Verilator sim — full mode (Q=50/75/95)
        run: python python/run_verilator_sim.py

      - name: Verilator sim — lite mode (Q=50/75/95)
        run: python python/run_verilator_sim.py --lite

      - name: Upload Verilator sim JPEG outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verilator-sim-output
          path: build/sim_verilator/sim_output_*.jpg
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # RTL code coverage — Verilator (line + toggle + branch)
  # ---------------------------------------------------------------------------
  rtl-coverage:
    name: RTL coverage (Verilator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, Verilator, lcov, deps, test image
        uses: ./.github/actions/setup-sim
        with:
          apt-packages: verilator g++ make lcov ffmpeg

      - name: Run coverage (full mode, Q=50/75/95)
        run: python python/run_coverage.py --html

      - name: Run coverage (lite mode, Q=50/75/95)
        run: python python/run_coverage.py --lite --html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-coverage
          path: |
            build/coverage/coverage.info
            build/coverage/html/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # FuseSoC — core descriptor validation, lint, and sim-target smoke test
  # ---------------------------------------------------------------------------
  fusesoc:
    name: FuseSoC (core validation + lint + sim)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, FuseSoC, Verilator, iverilog, test image
        uses: ./.github/actions/setup-sim
        with:
          apt-packages: verilator make iverilog
          pip-extra: "fusesoc>=2.4,<3"

      - name: Register core library
        run: fusesoc library add mjpegzero .

      - name: Validate core descriptor (core-info)
        run: fusesoc core-info bard0-design:mjpegzero:mjpegzero_enc

      - name: Lint via FuseSoC (Verilator, LITE_MODE=1 default)
        run: fusesoc run --target lint bard0-design:mjpegzero:mjpegzero_enc

      - name: Lint via FuseSoC (Verilator, LITE_MODE=0)
        run: fusesoc run --target lint bard0-design:mjpegzero:mjpegzero_enc --LITE_MODE 0

      # tb_iverilog always exits 0, so gate on its summary line.
      - name: Sim targets via FuseSoC (icarus smoke test, full + lite)
        run: |
          python python/generate_test_vectors.py
          fusesoc run --target sim bard0-design:mjpegzero:mjpegzero_enc | tee fs_sim.log
          grep -q "ALL TESTS PASSED" fs_sim.log
          fusesoc run --target sim_lite bard0-design:mjpegzero:mjpegzero_enc | tee fs_sim_lite.log
          grep -q "ALL TESTS PASSED" fs_sim_lite.log

  # ---------------------------------------------------------------------------
  # cocotb dual-language sim - ONE testbench, both ports: Verilog (Icarus) and
  # VHDL (GHDL), each golden-checked. Gives the VHDL port real CI coverage.
  # ---------------------------------------------------------------------------
  cocotb-dual:
    name: cocotb (Verilog + VHDL)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, Icarus, cocotb, deps, test image
        uses: ./.github/actions/setup-sim
        with:
          apt-packages: iverilog ffmpeg
          pip-extra: "cocotb>=2.0,<3"

      - name: Install GHDL
        run: |
          # Use GHDL's GCC backend (compiled, fast). NOT ghdl-llvm: on Ubuntu 24.04
          # ghdl-llvm 4.1.0 links the soname "libLLVM-18.so.18.1", but the distro's
          # libllvm18 only ships "libLLVM.so.18.1" -> the LLVM backend dies at
          # analyze time with "libLLVM-18.so.18.1: cannot open shared object file"
          # (a packaging bug no install flag fixes). The GCC backend has no libLLVM
          # dependency. Fall back to mcode only if ghdl-gcc is unavailable.
          sudo apt-get install -y --no-install-recommends ghdl-gcc \
            || sudo apt-get install -y --no-install-recommends ghdl-mcode \
            || sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version

      - name: Generate test vectors + golden references
        run: python python/generate_test_vectors.py  # 4-MCU yuyv_input.hex + reference_4mcu*.jpg

      - name: cocotb - Verilog/Icarus (full Q95)
        run: python sim/cocotb/test_runner.py verilog full 95 1

      - name: cocotb - Verilog/Icarus (lite Q75)
        run: python sim/cocotb/test_runner.py verilog lite 75 1

      - name: cocotb - Verilog/Icarus (multi-frame, full Q95 x2)
        run: python sim/cocotb/test_runner.py verilog full 95 2

      - name: cocotb - VHDL/GHDL (full Q95)
        run: python sim/cocotb/test_runner.py vhdl full 95 1

      - name: cocotb - VHDL/GHDL (lite Q75)
        run: python sim/cocotb/test_runner.py vhdl lite 75 1

      - name: cocotb - VHDL/GHDL (multi-frame, full Q95 x2)
        run: python sim/cocotb/test_runner.py vhdl full 95 2

      # VHDL port through the same back-to-back stream checks as the Verilog
      # rtl-sim job, plus --xcheck: the Verilog iverilog testbench runs the same
      # input and every VHDL frame must be byte-identical to it.
      - name: Stream VHDL — QUALITY change, restart wrap, gaps (vs Verilog)
        run: python python/verify_stream.py --sim cocotb-vhdl --xcheck --width 64 --height 16 --quality2 30 --restart 3 --gaps
      - name: Stream VHDL — lite, restart 1, ENABLE toggle (vs Verilog)
        run: python python/verify_stream.py --sim cocotb-vhdl --xcheck --width 64 --height 16 --lite --quality 95 --restart 1 --toggle-enable
      - name: Stream VHDL — RGB input, HUFF_BANKS=2, restart 5 (vs Verilog)
        run: python python/verify_stream.py --sim cocotb-vhdl --xcheck --width 64 --height 16 --rgb --huff-banks 2 --restart 5
      - name: Stream VHDL — EXIF, Q100 -> QUALITY=0 clamp, HUFF_BANKS=4 (vs Verilog)
        run: python python/verify_stream.py --sim cocotb-vhdl --xcheck --width 64 --height 16 --exif --quality 100 --quality2 0 --huff-banks 4
      - name: Stream VHDL — lite RGB + EXIF + gaps (vs Verilog)
        run: python python/verify_stream.py --sim cocotb-vhdl --xcheck --width 64 --height 16 --lite --rgb --exif --gaps

      # Demo JPEG output path (capture -> buffer -> RTP), Icarus-only. Self-
      # contained: builds a synthetic JPEG, no test vectors/ffmpeg needed.
      - name: cocotb - demo JPEG path (capture/buffer/RTP contract)
        run: python example_proj/arty_a7_100t_eth/sim/cocotb/run_jpeg_path.py
